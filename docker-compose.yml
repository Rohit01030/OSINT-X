version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: osintx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osintx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osintx}
      POSTGRES_DB: ${POSTGRES_DB:-osintx}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osintx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: osintx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: osintx-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://osintx:osintx@postgres:5432/osintx
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: osintx-frontend
    restart: unless-stopped
    ports:
      - "5173:80"

  ollama:
    image: ollama/ollama:latest
    container_name: osintx-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  celery-worker:
    build: ./backend
    container_name: osintx-celery-worker
    restart: unless-stopped
    command: celery -A core.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - backend

  nginx:
    image: nginx:alpine
    container_name: osintx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  ollama_data:
